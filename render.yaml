# Free demonstration: SQLite is ephemeral and cannot survive a restart.
services:
  - type: web
    name: paribus-assessment
    runtime: docker
    plan: free
    region: oregon
    branch: main
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      - key: DIRECTORY_API_BASE_URL
        value: https://hospital-directory.onrender.com
      - key: SQLITE_PATH
        value: /data/hospitals.db
