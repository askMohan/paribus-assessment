# Paid service and disk: preserve SQLite across deployments and restarts.
services:
  - type: web
    name: paribus-assessment
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    branch: main
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      - key: DIRECTORY_API_BASE_URL
        value: https://hospital-directory.onrender.com
      - key: SQLITE_PATH
        value: /data/hospitals.db
    disk:
      name: hospital-data
      mountPath: /data
      sizeGB: 1
